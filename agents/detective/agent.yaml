title: "🕵️ 탐정"
# 쓸 수 있는 손 (hands/ 폴더의 함수 이름). 화면 체크박스와 같습니다.
hands: [list_files, peek_file, file_info, get_time, web_search, web_read]

# ── 루프 손잡이 ──
max_turns: 8              # 루프를 최대 몇 바퀴 돌지. 3으로 줄이면 추리 도중 멈춥니다
limits: {web: 5}          # 한 번의 질문에서 손을 몇 번까지 쓸지 (web = web_search + web_read)
no_repeat: true           # 같은 손을 같은 값으로 또 부르면 다시 실행하지 않고 "이미 했다"고 알려 줌
ask_before: []            # 실행 전에 사람 승인을 받을 손
retry: 4                  # 서버가 바쁠 때(429/503) 기다렸다 다시 부르는 횟수
remember_tool_results: false  # true면 읽은 내용을 다음 질문에도 기억 (대신 글 양·비용이 커짐)

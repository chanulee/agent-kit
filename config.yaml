# 에이전트 키트 설정. 화면에서 부품을 켜면 agents/my-agent/agent.yaml 이 바뀝니다.

# 대화하는 에이전트. 학생이 한 단계씩 키웁니다.
agent: my-agent

# 팀 실행에서 갤러리를 만드는 준비된 에이전트
team_partner: docent

# 뇌(모델). 기본은 Z.ai GLM (키: .env 의 ZAI_API_KEY)
model: "openai:glm-4.5-flash"
base_url: "https://api.z.ai/api/paas/v4/"
key_env: ZAI_API_KEY

# 에이전트가 일하는 사본 폴더 (화면의 [📁 폴더 고르기]가 채워 줌. 원본이 아니라 복사본)
folder: "~/agent-workshop/copy"

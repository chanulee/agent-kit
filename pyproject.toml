[project]
name = "agent-kit"
version = "0.1.0"
description = "디자인 전공생을 위한 에이전트 워크숍 키트 (aisuite 기반 대시보드)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aisuite[openai,mcp]==0.2.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "ruamel.yaml>=0.18,<0.19",
    "httpx>=0.27,<1",
    "pypdf>=5,<7",
    "pillow>=10,<13",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 진짜 모델·인터넷이 필요한 시험. 실행: uv run pytest -m live"]
addopts = "-m 'not live'"
